    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Rubik:wght@600;700&display=swap">
    <style>{CSS}</style>
    </head>
    <body>
    <div class="wrap">
    <header>
    {logo}
    <div>
    <h1 id="count"><span class="p">いま <strong>{len(names)}</strong> 個のアプリが、</span><span class="p">わいわい広場の</span><span class="p">Kubernetes で動いています</span></h1>
    <p class="lead"><span class="p">来場者が PR で載せた OSS と、</span><span class="p">AI と作った自作のアプリです。</span><br><span class="p">タイルを押すか、</span><span class="p"><b>&lt;名前&gt;.<wbr>showcase.<wbr>cloudnativedays.<wbr>jp</b> を</span><span class="p">開いてください。</span></p>
    <a class="cta" href="{REPO}">{GITHUB_MARK}GitHub でリポジトリを開く</a>
    </div>
    </header>
    <main>{hive}</main>
    <footer><a href="{REPO}">{QR}</a><p><span class="p">スマートフォンで読み取ると、</span><span class="p">リポジトリが開きます。</span><br><span class="p">PR を出せば、</span><span class="p">あなたのアプリも</span><span class="p">ここに並びます。</span><br><a href="{REPO}">github.com/<wbr>cloudnativedaysjp/<wbr>oss-showcase</a></p><div class="mascots"><img src="{MASCOTS}/suu-2.png" alt="" width="2586" height="1716"><img src="{MASCOTS}/toge-2.png" alt="" width="2587" height="1716"></div></footer>
    </div>
    <script>{SCRIPT}</script>
    </body>
    </html>"""


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body, code = page([h for h in hosts() if not h.startswith("portal.")]).encode(), 200
            except Exception:
                body, code = "一覧を読めませんでした".encode(), 503
            self.send_response(code)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
      - name: portal
        image: python:3.13-alpine
        command:
        - python3
        - /app/server.py
        ports:
        - containerPort: 8080
        securityContext:
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: portal
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector:
    app: portal
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
spec:
  parentRefs:
  - name: showcase
    namespace: gateway
  hostnames:
  - portal.showcase.cloudnativedays.jp
  rules:
  - backendRefs:
    - name: portal
      port: 80
